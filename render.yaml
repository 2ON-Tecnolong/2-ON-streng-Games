services:
  - type: web
    name: 2-on-streng-games
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: 2 On Streng Games
      - key: ADMIN_TOKEN
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ROOM_TTL_MS
        value: 21600000
      - key: BACKUP_INTERVAL_MS
        value: 1800000
